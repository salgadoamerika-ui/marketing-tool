kind = "web"
previewPath = "/"
title = "Marketing Tool Greeting"
description = "A minimal React page that introduces the marketing tool with a single greeting."
version = "1.0.0"
id = "artifacts/marketing-tool"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19923

[services.development]
run = "pnpm --filter @workspace/marketing-tool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/marketing-tool", "run", "build" ]
serve = "static"
publicDir = "artifacts/marketing-tool/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19923"
BASE_PATH = "/"
